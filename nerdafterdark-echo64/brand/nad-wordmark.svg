<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 92" width="620" height="92" role="img" aria-label="Nerd After Dark wordmark">
  <title>Nerd After Dark</title>
  <defs>
    <filter id="text-glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="accent-glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="top-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="30%"  stop-color="#00f5ff"/>
      <stop offset="70%"  stop-color="#ff00e5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="bottom-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="50%"  stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="620" height="92" fill="#07070f" rx="6"/>

  <!-- Top neon rule -->
  <line x1="0" y1="0" x2="620" y2="0" stroke="url(#top-grad)" stroke-width="2"/>

  <!-- NERD — cyan, neon glow -->
  <text x="22" y="62"
        font-family="'VT323', 'Courier New', monospace"
        font-size="58"
        fill="#00f5ff"
        filter="url(#text-glow)"
        letter-spacing="4">NERD</text>

  <!-- Separator dot -->
  <circle cx="182" cy="46" r="3" fill="#444460"/>

  <!-- AFTER — neutral white/grey -->
  <text x="194" y="62"
        font-family="'VT323', 'Courier New', monospace"
        font-size="58"
        fill="#c8c8e0"
        letter-spacing="4">AFTER</text>

  <!-- Separator dot -->
  <circle cx="392" cy="46" r="3" fill="#444460"/>

  <!-- DARK — magenta neon -->
  <text x="404" y="62"
        font-family="'VT323', 'Courier New', monospace"
        font-size="58"
        fill="#ff00e5"
        filter="url(#accent-glow)"
        letter-spacing="4">DARK</text>

  <!-- Tagline — readable size + color -->
  <text x="310" y="80"
        font-family="'VT323', 'Courier New', monospace"
        font-size="15"
        fill="#8888b0"
        text-anchor="middle"
        letter-spacing="3">SCI-FI  /  AI  /  RETRO TECH  /  STRONG OPINIONS</text>

  <!-- Bottom neon rule -->
  <line x1="0" y1="91" x2="620" y2="91" stroke="url(#bottom-grad)" stroke-width="1" opacity="0.5"/>

</svg>
