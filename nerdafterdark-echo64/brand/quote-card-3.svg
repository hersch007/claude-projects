<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Quote card 3">
  <defs>
    <linearGradient id="top-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#00f5ff"/>
      <stop offset="70%" stop-color="#ff00e5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow-cyan" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#07070f"/>

  <!-- Top gradient rule -->
  <rect x="0" y="0" width="1080" height="3" fill="url(#top-rule)"/>

  <!-- Corner dots -->
  <circle cx="40" cy="40" r="4" fill="#00f5ff" opacity="0.5"/>
  <circle cx="1040" cy="40" r="4" fill="#00f5ff" opacity="0.5"/>
  <circle cx="40" cy="1040" r="4" fill="#ff00e5" opacity="0.5"/>
  <circle cx="1040" cy="1040" r="4" fill="#ff00e5" opacity="0.5"/>

  <!-- Outer border -->
  <rect x="30" y="30" width="1020" height="1020" fill="none" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Quote mark -->
  <text x="540" y="280"
        font-family="'VT323', 'Courier New', monospace"
        font-size="180"
        fill="#00f5ff"
        text-anchor="middle"
        opacity="0.1">"</text>

  <!-- Quote text line 1 -->
  <text x="540" y="410"
        font-family="'VT323', 'Courier New', monospace"
        font-size="66"
        fill="#e8eaf6"
        text-anchor="middle"
        filter="url(#glow-soft)"
        letter-spacing="1">Big Brother didn't need</text>

  <!-- Quote text line 2 -->
  <text x="540" y="500"
        font-family="'VT323', 'Courier New', monospace"
        font-size="66"
        fill="#e8eaf6"
        text-anchor="middle"
        filter="url(#glow-soft)"
        letter-spacing="1">to be watching.</text>

  <!-- Quote text line 3 -->
  <text x="540" y="610"
        font-family="'VT323', 'Courier New', monospace"
        font-size="66"
        fill="#e8eaf6"
        text-anchor="middle"
        filter="url(#glow-soft)"
        letter-spacing="1">He just needed you</text>

  <!-- Quote text line 4 -->
  <text x="540" y="700"
        font-family="'VT323', 'Courier New', monospace"
        font-size="66"
        fill="#00f5ff"
        text-anchor="middle"
        filter="url(#glow-cyan)"
        letter-spacing="1">to forget he was there.</text>

  <!-- Divider -->
  <line x1="380" y1="770" x2="700" y2="770" stroke="#1a1a2e" stroke-width="1"/>

  <!-- Attribution -->
  <text x="540" y="820"
        font-family="'VT323', 'Courier New', monospace"
        font-size="28"
        fill="#8888b0"
        text-anchor="middle"
        letter-spacing="4">ECHO-64  //  NERDAFTERDARK.COM</text>

  <!-- Bottom tag -->
  <text x="540" y="1020"
        font-family="'VT323', 'Courier New', monospace"
        font-size="22"
        fill="#444460"
        text-anchor="middle"
        letter-spacing="3">SCI-FI AFTER MIDNIGHT  ·  1984</text>

  <!-- Bottom gradient rule -->
  <rect x="0" y="1077" width="1080" height="3" fill="url(#top-rule)" opacity="0.4"/>
</svg>
