<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="Echo-64 icon">
  <title>Echo-64</title>
  <defs>
    <filter id="phosphor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bezel-glow" x="-4%" y="-4%" width="108%" height="108%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="screen-bloom" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#061414"/>
      <stop offset="100%" stop-color="#030306"/>
    </radialGradient>
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="rgba(0,0,0,0.45)"/>
    </pattern>
  </defs>

  <!-- Monitor outer bezel -->
  <rect x="8" y="6" width="204" height="140" rx="18" ry="18"
        fill="#111122" stroke="#00f5ff" stroke-width="1.5"
        filter="url(#bezel-glow)"/>

  <!-- Bezel inner shadow -->
  <rect x="10" y="8" width="200" height="136" rx="16" ry="16"
        fill="none" stroke="#1e1e3a" stroke-width="3"/>

  <!-- Screen surround -->
  <rect x="22" y="20" width="176" height="112" rx="8" ry="8"
        fill="#08081a"/>

  <!-- Screen -->
  <rect x="26" y="24" width="168" height="104" rx="5" ry="5"
        fill="url(#screen-bloom)"/>

  <!-- Scanlines -->
  <rect x="26" y="24" width="168" height="104" rx="5" ry="5"
        fill="url(#scanlines)" opacity="0.6"/>

  <!-- Screen edge glow -->
  <rect x="26" y="24" width="168" height="104" rx="5" ry="5"
        fill="none" stroke="#00f5ff" stroke-width="0.75" opacity="0.25"/>

  <!-- Screen line 1: READY. (faint, top) -->
  <text x="38" y="46"
        font-family="'VT323', 'Courier New', monospace"
        font-size="13"
        fill="#00f5ff"
        opacity="0.4"
        filter="url(#phosphor)">READY.</text>

  <!-- Screen line 2: ECHO-64 — smaller font gives more vertical clearance -->
  <text x="38" y="76"
        font-family="'VT323', 'Courier New', monospace"
        font-size="28"
        fill="#00f5ff"
        filter="url(#phosphor)"
        letter-spacing="1">ECHO-64</text>

  <!-- Screen line 3: cursor — 30px below text baseline, no overlap possible -->
  <rect x="38" y="106" width="13" height="14"
        fill="#00f5ff" filter="url(#phosphor)" opacity="0.85"/>

  <!-- Top accent bars on bezel -->
  <line x1="40" y1="6" x2="180" y2="6"
        stroke="#00f5ff" stroke-width="2" opacity="0.6" filter="url(#phosphor)"/>
  <line x1="60" y1="6" x2="160" y2="6"
        stroke="#ff00e5" stroke-width="1" opacity="0.4" filter="url(#phosphor)"/>

  <!-- Neck (trapezoid) -->
  <path d="M 86,146 L 134,146 L 128,166 L 92,166 Z"
        fill="#0c0c1e" stroke="#1a1a30" stroke-width="1"/>

  <!-- Base -->
  <rect x="62" y="166" width="96" height="14" rx="5" ry="5"
        fill="#0c0c1e" stroke="#1a1a30" stroke-width="1"/>

  <!-- Base accent line -->
  <line x1="76" y1="173" x2="144" y2="173"
        stroke="#00f5ff" stroke-width="1" opacity="0.35"/>

</svg>
