<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Platform — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f6fa;
    color: #1e293b;
  }
  .app-shell { display: flex; min-height: 100vh; align-items: stretch; }
  .sidebar {
    width: 220px; flex-shrink: 0; background: white; border-right: 1px solid #e2e8f0;
    padding: 20px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .sidebar-brand {
    font-weight: 800; font-size: 15px; margin-bottom: 22px; padding: 0 10px;
    text-decoration: none; color: #0B0B0C;
  }
  .sidebar-section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #94a3b8;
    margin: 18px 10px 6px; font-weight: 700;
  }
  .sidebar-link, .sidebar-btn {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #475569; text-decoration: none; cursor: pointer;
    border: none; background: none; width: 100%; text-align: left;
  }
  .sidebar-link:hover, .sidebar-btn:hover { background: #f1f5f9; }
  .sidebar-link.active { background: #eef2ff; color: #1d4ed8; }
  .sidebar-link svg, .sidebar-btn svg { flex-shrink: 0; width: 18px; height: 18px; }
  .sidebar-spacer { flex: 1; }
  .main-content { flex: 1; padding: 32px; min-width: 0; }
  .container { max-width: 900px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  #run-all-status { font-size: 12px; color: #64748b; }
  h1 { font-size: 20px; }
  .client-list { display: flex; flex-direction: column; gap: 10px; }
  .client-row {
    background: white;
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: inherit;
  }
  .client-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .client-name { font-weight: 700; font-size: 14px; }
  .client-url { color: #64748b; font-size: 12px; margin-top: 2px; }
  .client-score-gauge { flex-shrink: 0; width: 52px; height: 52px; }
  .client-date { color: #94a3b8; font-size: 11px; min-width: 90px; text-align: right; }
  .empty { text-align: center; color: #64748b; padding: 60px 0; }
  button, .btn {
    background: #0B0B0C; color: white; border: none; border-radius: 20px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn.secondary { background: #f1f5f9; color: #475569; border: 1px solid transparent; }
  .btn.secondary:hover { background: #e2e8f0; }
  .btn.danger { background: #fef2f2; color: #dc2626; border: 1px solid transparent; }
  .btn.danger:hover { background: #fee2e2; }
  #migrate-status { font-size: 12px; color: #64748b; margin-top: 10px; }
  .client-link { flex: 1; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 16px; }
  .client-actions { display: flex; gap: 6px; margin-left: 16px; }
  .client-actions button { padding: 6px 10px; font-size: 12px; }
  .client-actions button:disabled { opacity: .5; cursor: default; }
  .run-progress { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; width: 52px; flex-shrink: 0; }
  .run-spinner {
    width: 18px; height: 18px; border-radius: 50%; border: 2px solid #e2e8f0; border-top-color: #1d4ed8;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .run-progress-label { font-size: 10px; color: #94a3b8; white-space: nowrap; }
  .run-error-badge { font-size: 10px; color: #dc2626; font-weight: 700; white-space: nowrap; }
  .toggle-archived { font-size: 12px; color: #64748b; background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; margin-bottom: 14px; }
  .new-client-form {
    background: white; border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .new-client-form input { font-size: 13px; padding: 8px 10px; border-radius: 6px; border: 1px solid #cbd5e1; }
  .new-client-form input[name="name"] { flex: 1; min-width: 140px; }
  .new-client-form input[name="url"] { flex: 1; min-width: 160px; }
  #new-client-status { font-size: 12px; margin-top: 8px; width: 100%; }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar">
    <a class="sidebar-brand" href="/">SEO Platform</a>

    <a class="sidebar-link active" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a class="sidebar-link" href="/referral-partners.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Referral Partners
    </a>
    <a class="sidebar-link" href="/settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>

    <div class="sidebar-section-label">Admin</div>
    <button id="new-client-btn" class="sidebar-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Client
    </button>
    <button id="migrate-btn" class="sidebar-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Sync from Config
    </button>
    <div id="migrate-status" style="padding:0 10px"></div>

    <div class="sidebar-spacer"></div>
  </nav>

  <div class="main-content">
    <div class="container">
      <div class="header">
        <h1>Clients</h1>
        <div class="header-actions">
          <span id="run-all-status"></span>
          <button id="run-all-btn" class="btn secondary">Run All Audits</button>
        </div>
      </div>

      <form id="new-client-form" class="new-client-form" style="display:none">
        <input name="name" placeholder="Client name" required>
        <input name="url" placeholder="https://example.com" required>
        <input name="slug" placeholder="auto-filled from name" required>
        <button type="submit">Add Client</button>
        <button type="button" id="new-client-cancel" class="btn secondary">Cancel</button>
        <div id="new-client-status" style="width:100%"></div>
        <small style="width:100%;color:#94a3b8">Slug is this app's internal ID for the client (used in its dashboard URL) — auto-filled from the name above, not related to the client's own website. Edit it only if you want something different.</small>
      </form>

      <button id="toggle-archived" class="toggle-archived">Show archived clients</button>
      <div id="client-list" class="client-list">
        <div class="empty">Loading clients...</div>
      </div>
    </div>
  </div>
</div>

<script>
  let showingArchived = false;

  function scoreColorHex(score) {
    if (score === null || score === undefined) return '#cbd5e1';
    if (score >= 80) return '#16a34a';
    if (score >= 60) return '#d97706';
    return '#dc2626';
  }

  // Mini version of the client report's cover score ring — same visual
  // language (a colored arc, not just a flat number) carried into the
  // internal dashboard for at-a-glance scanning across many clients.
  function scoreGaugeSvg(score) {
    const r = 20, circ = 2 * Math.PI * r;
    const has = score !== null && score !== undefined;
    const pct = has ? Math.max(0, Math.min(100, score)) : 0;
    const offset = circ * (1 - pct / 100);
    const color = scoreColorHex(score);
    return `
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="5"/>
        ${has ? `<circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
          transform="rotate(-90 26 26)"/>` : ''}
        <text x="26" y="30" text-anchor="middle" font-size="${has ? 15 : 11}" font-weight="800" fill="${color}">${has ? score : '—'}</text>
      </svg>`;
  }

  // Local cache of the last server fetch, plus in-flight audit state keyed
  // by slug — kept separate from the server data so a running audit's
  // progress can update in place without a full re-fetch/re-render
  // clobbering every OTHER row's own in-flight status (several audits can
  // run at once via "Run All", each polling independently).
  let clients = [];
  const runningAudits = {}; // slug -> { pagesCrawled, totalQueued, status: 'crawling'|'error', error? }

  function renderClients() {
    const listEl = document.getElementById('client-list');
    if (!clients.length) {
      listEl.innerHTML = showingArchived
        ? '<div class="empty">No archived clients.</div>'
        : '<div class="empty">No clients yet — click "Sync from Config" or "New Client" in the sidebar.</div>';
      return;
    }

    listEl.innerHTML = clients.map(c => {
      const running = runningAudits[c.slug];
      const progressHtml = running
        ? (running.status === 'error'
            ? `<div class="run-progress"><span class="run-error-badge">Failed</span></div>`
            : `<div class="run-progress"><div class="run-spinner"></div><span class="run-progress-label">${running.pagesCrawled || 0} pages</span></div>`)
        : `<div class="client-score-gauge">${scoreGaugeSvg(c.latest_score)}</div>`;
      return `
      <div class="client-row">
        <a class="client-link" href="/client.html?slug=${encodeURIComponent(c.slug)}">
          <div>
            <div class="client-name">${c.name}</div>
            <div class="client-url">${c.url}</div>
          </div>
          <div class="client-date">${c.latest_run_date ? new Date(c.latest_run_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Never audited'}</div>
          ${progressHtml}
        </a>
        <div class="client-actions">
          <button class="btn secondary" data-action="run" data-slug="${c.slug}" ${running ? 'disabled' : ''}>Run Audit</button>
          <button class="btn secondary" data-action="archive" data-slug="${c.slug}">${showingArchived ? 'Unarchive' : 'Archive'}</button>
          <button class="btn danger" data-action="delete" data-slug="${c.slug}" data-name="${c.name}">Delete</button>
        </div>
      </div>
    `;
    }).join('');
  }

  async function loadClients() {
    const res = await fetch(`/api/clients?archived=${showingArchived ? '1' : '0'}`);
    clients = await res.json();
    renderClients();
  }

  // Fire-and-forget from this dashboard's point of view — starts the audit,
  // then polls status independently of whatever else is rendering/running.
  // Uses the server's own default-provider resolution (no picker here);
  // matches what "no provider selected" already does on the client page.
  async function startAudit(slug) {
    if (runningAudits[slug]) return;
    runningAudits[slug] = { pagesCrawled: 0, totalQueued: 0, status: 'crawling' };
    renderClients();

    let runId;
    try {
      const res = await fetch(`/api/clients/${encodeURIComponent(slug)}/audit/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      runId = data.runId;
    } catch (err) {
      runningAudits[slug] = { status: 'error', error: err.message };
      renderClients();
      return;
    }

    return new Promise((resolve) => {
      const poll = setInterval(async () => {
        const res = await fetch(`/api/clients/${encodeURIComponent(slug)}/audit/status/${runId}`);
        const s = await res.json();
        if (s.status === 'done') {
          clearInterval(poll);
          delete runningAudits[slug];
          const client = clients.find(c => c.slug === slug);
          if (client) {
            client.latest_score = s.score;
            client.latest_run_date = new Date().toISOString();
          }
          renderClients();
          resolve();
        } else if (s.status === 'error') {
          clearInterval(poll);
          runningAudits[slug] = { status: 'error', error: s.error };
          renderClients();
          resolve();
        } else {
          runningAudits[slug] = { pagesCrawled: s.pagesCrawled || 0, totalQueued: s.totalQueued || 0, status: 'crawling' };
          renderClients();
        }
      }, 2000);
    });
  }

  document.getElementById('client-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const slug = btn.dataset.slug;

    if (btn.dataset.action === 'run') {
      startAudit(slug);
    } else if (btn.dataset.action === 'archive') {
      await fetch(`/api/clients/${encodeURIComponent(slug)}/archive`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ archived: !showingArchived }),
      });
      loadClients();
    } else if (btn.dataset.action === 'delete') {
      if (!confirm(`Permanently delete "${btn.dataset.name}" and all its history? This cannot be undone.`)) return;
      await fetch(`/api/clients/${encodeURIComponent(slug)}`, { method: 'DELETE' });
      loadClients();
    }
  });

  document.getElementById('run-all-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('run-all-status');
    const btn = document.getElementById('run-all-btn');
    const targets = clients.filter(c => !runningAudits[c.slug]);
    if (!targets.length) return;
    btn.disabled = true;
    statusEl.textContent = `Running ${targets.length} audit${targets.length > 1 ? 's' : ''}...`;
    await Promise.all(targets.map(c => startAudit(c.slug)));
    btn.disabled = false;
    statusEl.textContent = 'All audits finished.';
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
  });

  document.getElementById('toggle-archived').addEventListener('click', () => {
    showingArchived = !showingArchived;
    document.getElementById('toggle-archived').textContent = showingArchived ? 'Show active clients' : 'Show archived clients';
    document.getElementById('run-all-btn').style.display = showingArchived ? 'none' : 'inline-block';
    loadClients();
  });

  // Slug auto-fills from the client name (like most admin panels) so it's
  // normally a "set it and forget it" field, not something a user needs to
  // hand-craft. slugManuallyEdited tracks real keystrokes in the slug
  // field itself (not our own programmatic .value writes below, which
  // don't fire 'input') so a deliberate custom slug never gets clobbered.
  function slugify(str) {
    return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  let slugManuallyEdited = false;
  const newClientForm = document.getElementById('new-client-form');
  const nameInput = newClientForm.querySelector('input[name="name"]');
  const slugInput = newClientForm.querySelector('input[name="slug"]');
  nameInput.addEventListener('input', () => {
    if (!slugManuallyEdited) slugInput.value = slugify(nameInput.value);
  });
  slugInput.addEventListener('input', () => { slugManuallyEdited = true; });

  document.getElementById('new-client-btn').addEventListener('click', () => {
    slugManuallyEdited = false;
    document.getElementById('new-client-form').style.display = 'flex';
    document.getElementById('new-client-form').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  document.getElementById('new-client-cancel').addEventListener('click', () => {
    document.getElementById('new-client-form').style.display = 'none';
  });

  document.getElementById('new-client-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const statusEl = document.getElementById('new-client-status');
    const body = {
      name: form.name.value.trim(),
      url: form.url.value.trim(),
      slug: form.slug.value.trim().toLowerCase(),
    };
    const res = await fetch('/api/clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) {
      statusEl.style.color = '#dc2626';
      statusEl.textContent = data.error;
      return;
    }
    form.reset();
    form.style.display = 'none';
    statusEl.textContent = '';
    loadClients();
  });

  document.getElementById('migrate-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('migrate-status');
    statusEl.textContent = 'Syncing...';
    const res = await fetch('/api/admin/migrate', { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = 'Error: ' + data.error;
      return;
    }
    statusEl.textContent = `Synced ${data.clientsUpserted} clients, imported ${data.historyRowsImported} history rows, ${data.keywordRowsImported} keyword snapshots.` +
      (data.errors.length ? ` ${data.errors.length} error(s): ${data.errors.join('; ')}` : '');
    loadClients();
  });

  loadClients();
</script>

</body>
</html>
