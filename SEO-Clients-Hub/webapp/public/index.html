<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Platform — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f6fa;
    color: #1e293b;
    padding: 32px;
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; max-width: 900px; margin-left: auto; margin-right: auto; }
  h1 { font-size: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .client-list { display: flex; flex-direction: column; gap: 10px; }
  .client-row {
    background: white;
    border-radius: 10px;
    padding: 16px 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: inherit;
  }
  .client-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .client-name { font-weight: 700; font-size: 14px; }
  .client-url { color: #64748b; font-size: 12px; margin-top: 2px; }
  .client-score-gauge { flex-shrink: 0; width: 52px; height: 52px; }
  .client-date { color: #94a3b8; font-size: 11px; min-width: 90px; text-align: right; }
  .empty { text-align: center; color: #64748b; padding: 60px 0; }
  button, .btn {
    background: #0B0B0C; color: white; border: none; border-radius: 20px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn.secondary { background: #f1f5f9; color: #475569; border: 1px solid transparent; }
  .btn.secondary:hover { background: #e2e8f0; }
  .btn.danger { background: #fef2f2; color: #dc2626; border: 1px solid transparent; }
  .btn.danger:hover { background: #fee2e2; }
  #migrate-status { font-size: 12px; color: #64748b; margin-top: 10px; }
  .header-actions { display: flex; gap: 8px; }
  .client-link { flex: 1; text-decoration: none; color: inherit; display: flex; align-items: center; gap: 16px; }
  .client-actions { display: flex; gap: 6px; margin-left: 16px; }
  .client-actions button { padding: 6px 10px; font-size: 12px; }
  .toggle-archived { font-size: 12px; color: #64748b; background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; margin-bottom: 14px; }
  .new-client-form {
    background: white; border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .new-client-form input { font-size: 13px; padding: 8px 10px; border-radius: 6px; border: 1px solid #cbd5e1; }
  .new-client-form input[name="name"] { flex: 1; min-width: 140px; }
  .new-client-form input[name="url"] { flex: 1; min-width: 160px; }
  #new-client-status { font-size: 12px; margin-top: 8px; width: 100%; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>SEO Platform</h1>
    <div class="header-actions">
      <button id="new-client-btn" class="btn secondary">+ New Client</button>
      <button id="migrate-btn" class="btn secondary">Sync Clients from Config</button>
    </div>
  </div>
  <div id="migrate-status"></div>

  <form id="new-client-form" class="new-client-form" style="display:none">
    <input name="name" placeholder="Client name" required>
    <input name="url" placeholder="https://example.com" required>
    <input name="slug" placeholder="auto-filled from name" required>
    <button type="submit">Add Client</button>
    <button type="button" id="new-client-cancel" class="btn secondary">Cancel</button>
    <div id="new-client-status" style="width:100%"></div>
    <small style="width:100%;color:#94a3b8">Slug is this app's internal ID for the client (used in its dashboard URL) — auto-filled from the name above, not related to the client's own website. Edit it only if you want something different.</small>
  </form>

  <button id="toggle-archived" class="toggle-archived">Show archived clients</button>
  <div id="client-list" class="client-list">
    <div class="empty">Loading clients...</div>
  </div>
</div>

<script>
  let showingArchived = false;

  function scoreColorHex(score) {
    if (score === null || score === undefined) return '#cbd5e1';
    if (score >= 80) return '#16a34a';
    if (score >= 60) return '#d97706';
    return '#dc2626';
  }

  // Mini version of the client report's cover score ring — same visual
  // language (a colored arc, not just a flat number) carried into the
  // internal dashboard for at-a-glance scanning across many clients.
  function scoreGaugeSvg(score) {
    const r = 20, circ = 2 * Math.PI * r;
    const has = score !== null && score !== undefined;
    const pct = has ? Math.max(0, Math.min(100, score)) : 0;
    const offset = circ * (1 - pct / 100);
    const color = scoreColorHex(score);
    return `
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="5"/>
        ${has ? `<circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
          transform="rotate(-90 26 26)"/>` : ''}
        <text x="26" y="30" text-anchor="middle" font-size="${has ? 15 : 11}" font-weight="800" fill="${color}">${has ? score : '—'}</text>
      </svg>`;
  }

  async function loadClients() {
    const res = await fetch(`/api/clients?archived=${showingArchived ? '1' : '0'}`);
    const clients = await res.json();
    const listEl = document.getElementById('client-list');

    if (!clients.length) {
      listEl.innerHTML = showingArchived
        ? '<div class="empty">No archived clients.</div>'
        : '<div class="empty">No clients yet — click "Sync Clients from Config" or "+ New Client" above.</div>';
      return;
    }

    listEl.innerHTML = clients.map(c => `
      <div class="client-row">
        <a class="client-link" href="/client.html?slug=${encodeURIComponent(c.slug)}">
          <div>
            <div class="client-name">${c.name}</div>
            <div class="client-url">${c.url}</div>
          </div>
          <div class="client-date">${c.latest_run_date ? new Date(c.latest_run_date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Never audited'}</div>
          <div class="client-score-gauge">${scoreGaugeSvg(c.latest_score)}</div>
        </a>
        <div class="client-actions">
          <button class="btn secondary" data-action="archive" data-slug="${c.slug}">${showingArchived ? 'Unarchive' : 'Archive'}</button>
          <button class="btn danger" data-action="delete" data-slug="${c.slug}" data-name="${c.name}">Delete</button>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('client-list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const slug = btn.dataset.slug;

    if (btn.dataset.action === 'archive') {
      await fetch(`/api/clients/${encodeURIComponent(slug)}/archive`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ archived: !showingArchived }),
      });
      loadClients();
    } else if (btn.dataset.action === 'delete') {
      if (!confirm(`Permanently delete "${btn.dataset.name}" and all its history? This cannot be undone.`)) return;
      await fetch(`/api/clients/${encodeURIComponent(slug)}`, { method: 'DELETE' });
      loadClients();
    }
  });

  document.getElementById('toggle-archived').addEventListener('click', () => {
    showingArchived = !showingArchived;
    document.getElementById('toggle-archived').textContent = showingArchived ? 'Show active clients' : 'Show archived clients';
    loadClients();
  });

  // Slug auto-fills from the client name (like most admin panels) so it's
  // normally a "set it and forget it" field, not something a user needs to
  // hand-craft. slugManuallyEdited tracks real keystrokes in the slug
  // field itself (not our own programmatic .value writes below, which
  // don't fire 'input') so a deliberate custom slug never gets clobbered.
  function slugify(str) {
    return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  let slugManuallyEdited = false;
  const newClientForm = document.getElementById('new-client-form');
  const nameInput = newClientForm.querySelector('input[name="name"]');
  const slugInput = newClientForm.querySelector('input[name="slug"]');
  nameInput.addEventListener('input', () => {
    if (!slugManuallyEdited) slugInput.value = slugify(nameInput.value);
  });
  slugInput.addEventListener('input', () => { slugManuallyEdited = true; });

  document.getElementById('new-client-btn').addEventListener('click', () => {
    slugManuallyEdited = false;
    document.getElementById('new-client-form').style.display = 'flex';
    document.getElementById('new-client-btn').style.display = 'none';
  });
  document.getElementById('new-client-cancel').addEventListener('click', () => {
    document.getElementById('new-client-form').style.display = 'none';
    document.getElementById('new-client-btn').style.display = 'inline-block';
  });

  document.getElementById('new-client-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const statusEl = document.getElementById('new-client-status');
    const body = {
      name: form.name.value.trim(),
      url: form.url.value.trim(),
      slug: form.slug.value.trim().toLowerCase(),
    };
    const res = await fetch('/api/clients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) {
      statusEl.style.color = '#dc2626';
      statusEl.textContent = data.error;
      return;
    }
    form.reset();
    form.style.display = 'none';
    document.getElementById('new-client-btn').style.display = 'inline-block';
    statusEl.textContent = '';
    loadClients();
  });

  document.getElementById('migrate-btn').addEventListener('click', async () => {
    const statusEl = document.getElementById('migrate-status');
    statusEl.textContent = 'Syncing...';
    const res = await fetch('/api/admin/migrate', { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = 'Error: ' + data.error;
      return;
    }
    statusEl.textContent = `Synced ${data.clientsUpserted} clients, imported ${data.historyRowsImported} history rows, ${data.keywordRowsImported} keyword snapshots.` +
      (data.errors.length ? ` ${data.errors.length} error(s): ${data.errors.join('; ')}` : '');
    loadClients();
  });

  loadClients();
</script>

</body>
</html>
