<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #F1F5F9; color: #1E293B; padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  #loading, #error { text-align: center; padding: 80px 20px; color: #64748B; font-size: 15px; }
  #error { display: none; }

  #content { display: none; }

  .cover {
    border-radius: 16px; padding: 36px 32px; color: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12); margin-bottom: 20px;
  }
  .cover-eyebrow { font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-bottom: 18px; }
  .cover-logo {
    max-height: 40px; max-width: 180px; margin-bottom: 18px; display: block;
    background: #fff; padding: 8px 12px; border-radius: 8px;
  }
  .cover-name { font-size: 28px; font-weight: bold; margin-bottom: 4px; }
  .cover-url { font-size: 14px; color: rgba(255,255,255,0.75); margin-bottom: 28px; }

  .score-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .score-badge { position: relative; width: 132px; height: 132px; flex-shrink: 0; }
  .score-badge-inner {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .score-badge-num { font-size: 32px; font-weight: bold; line-height: 1; }
  .score-badge-label {
    font-size: 8px; letter-spacing: 0.5px; color: rgba(255,255,255,0.75);
    margin-top: 4px; max-width: 72px; line-height: 1.3;
  }
  .score-tier { font-size: 15px; font-weight: bold; letter-spacing: 1px; }
  .score-updated { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 6px; }

  .trend-card {
    background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .trend-card h2, .categories-card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: #64748B; margin-bottom: 16px;
  }
  .trend-empty { color: #94A3B8; font-size: 13px; font-style: italic; }

  .categories-card {
    background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .category-grid { grid-template-columns: 1fr; } }
  .category-card {
    display: flex; flex-direction: column;
    border: 1px solid #E2E8F0; border-left-width: 5px; border-left-style: solid;
    border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .category-card-header { display: flex; align-items: center; gap: 12px; }
  .category-score { font-size: 24px; font-weight: bold; min-width: 42px; }
  .category-name { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
  .category-detail { font-size: 11px; color: #64748B; }
  .category-chevron { font-size: 11px; color: #94A3B8; transition: transform 0.15s; flex-shrink: 0; }
  .category-card.expanded .category-chevron { transform: rotate(180deg); }
  .category-item-list { display: none; margin-top: 4px; }
  .category-card.expanded .category-item-list { display: block; }
  .category-item-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 0 6px 54px;
    border-top: 1px solid #F1F5F9; font-size: 12px;
  }
  .category-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .category-item-label { flex: 1; color: #1E293B; }
  .category-item-value { color: #64748B; font-weight: bold; white-space: nowrap; }

  .wins-card {
    background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .win-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #F1F5F9; }
  .win-row:last-child { border-bottom: none; }
  .win-check { color: #16A34A; font-size: 16px; font-weight: bold; flex-shrink: 0; margin-top: 1px; }
  .win-text { font-size: 13px; color: #1E293B; }
  .win-detail { font-size: 11px; color: #64748B; margin-top: 2px; }
  .win-date { font-size: 11px; color: #94A3B8; white-space: nowrap; margin-left: auto; padding-left: 12px; }

  .footer-note {
    text-align: center; font-size: 13px; color: #64748B; margin-top: 28px; line-height: 1.6;
  }
  .footer-note a { color: inherit; font-weight: bold; }
  .cross-sell-note {
    text-align: center; font-size: 12px; color: #94A3B8; line-height: 1.6;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid #E2E8F0;
  }
</style>
</head>
<body>

<div class="wrap">
  <div id="loading">Loading your dashboard&hellip;</div>
  <div id="error">
    <p style="font-size:16px;font-weight:bold;margin-bottom:8px">This link isn't active.</p>
    <p>It may have been disabled or replaced with a new one — check with your SEO provider for a current link.</p>
  </div>

  <div id="content">
    <div class="cover" id="cover">
      <div class="cover-eyebrow" id="cover-eyebrow"></div>
      <img id="cover-logo" class="cover-logo" style="display:none" alt="">
      <div class="cover-name" id="cover-name"></div>
      <div class="cover-url" id="cover-url"></div>
      <div class="score-row">
        <div class="score-badge">
          <svg width="132" height="132" viewBox="0 0 132 132" id="score-ring"></svg>
          <div class="score-badge-inner">
            <div class="score-badge-num" id="score-num"></div>
            <div class="score-badge-label">SEO HEALTH SCORE</div>
          </div>
        </div>
        <div>
          <div class="score-tier" id="score-tier"></div>
          <div class="score-updated" id="score-updated"></div>
        </div>
      </div>
    </div>

    <div class="trend-card">
      <h2>Score History</h2>
      <div id="trend-chart"></div>
    </div>

    <div class="categories-card">
      <h2>By Category</h2>
      <div class="category-grid" id="category-grid"></div>
    </div>

    <div class="wins-card" id="wins-card" style="display:none">
      <h2>What We've Fixed</h2>
      <div id="wins-list"></div>
    </div>

    <div class="wins-card" id="keyword-wins-card" style="display:none">
      <h2>Search Ranking Wins</h2>
      <div id="keyword-wins-list"></div>
    </div>

    <div class="footer-note" id="footer-note"></div>
    <div class="cross-sell-note" id="cross-sell-note" style="display:none"></div>
  </div>
</div>

<script>
  // Token comes from the URL path (/share/:token), not a query string —
  // this page is served for any token by the server (see index.js's
  // GET /share/:token), so validity is entirely determined by whether the
  // summary fetch below succeeds, not by anything checked here.
  const token = window.location.pathname.split('/').filter(Boolean).pop();

  function scoreTierColor(score) {
    return score >= 80 ? '#16A34A' : score >= 60 ? '#D97706' : '#DC2626';
  }
  function scoreTierLabel(score) {
    return score >= 85 ? 'Good' : score >= 70 ? 'Needs Improvement' : 'Needs Attention';
  }

  function renderScoreRing(score, color) {
    const r = 58, cx = 66, cy = 66;
    const circumference = 2 * Math.PI * r;
    const filled = Math.max(0, Math.min(100, score)) / 100 * circumference;
    return `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="10" />
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${filled.toFixed(1)} ${circumference.toFixed(1)}"
        transform="rotate(-90 ${cx} ${cy})" />
    `;
  }

  // Same polyline-chart math as audit-engine.js's buildTrendChart, adapted
  // for a white card (dark line/text) instead of that function's dark
  // cover background — kept as a small standalone version here rather
  // than sharing code, since this is browser-side JS and that one lives
  // server-side in a CommonJS module never sent to the client.
  function renderTrendChart(history, brandHex) {
    if (history.length < 2) {
      return `<div class="trend-empty">Score history will appear here after a second audit.</div>`;
    }
    const W = 680, H = 140, PAD = { top: 18, right: 16, bottom: 30, left: 16 };
    const chartW = W - PAD.left - PAD.right;
    const chartH = H - PAD.top - PAD.bottom;
    const scores = history.map(h => h.score);
    const minScore = Math.max(0, Math.min(...scores) - 10);
    const maxScore = Math.min(100, Math.max(...scores) + 5);
    const xStep = chartW / (history.length - 1);
    const yScale = v => chartH - ((v - minScore) / (maxScore - minScore)) * chartH;
    const points = history.map((h, i) => ({ x: PAD.left + i * xStep, y: PAD.top + yScale(h.score), ...h }));
    const polyline = points.map(p => `${p.x},${p.y}`).join(' ');
    const area = `${points[0].x},${PAD.top + chartH} ` + points.map(p => `${p.x},${p.y}`).join(' ') + ` ${points[points.length - 1].x},${PAD.top + chartH}`;
    const labels = points.map((p, i) => {
      // Thinning labels on a long history avoids them overlapping —
      // always keep the first and last, space the rest out.
      if (history.length > 8 && i % Math.ceil(history.length / 8) !== 0 && i !== points.length - 1) return '';
      const d = new Date(p.date + 'T12:00:00');
      const label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return `<text x="${p.x}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#94A3B8">${label}</text>`;
    }).join('');
    const dots = points.map((p, i) => {
      const isLast = i === points.length - 1;
      return `
        <circle cx="${p.x}" cy="${p.y}" r="${isLast ? 5 : 3.5}" fill="${isLast ? brandHex : '#fff'}" stroke="${brandHex}" stroke-width="2"/>
        <text x="${p.x}" y="${p.y - 10}" text-anchor="middle" font-size="${isLast ? 12 : 10}" font-weight="${isLast ? '700' : '400'}" fill="#1E293B">${p.score}</text>
      `;
    }).join('');
    return `
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;overflow:visible">
        <defs>
          <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${brandHex}" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="${brandHex}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${area}" fill="url(#tg)"/>
        <polyline points="${polyline}" fill="none" stroke="${brandHex}" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
      </svg>
    `;
  }

  // "good"/"warn"/"bad"/"neutral" match the status classes parseStatGrid
  // (server-side) reads off the internal report's own snap-card markup —
  // same vocabulary, not redefined here.
  const ITEM_STATUS_COLOR = { bad: '#DC2626', warn: '#D97706', good: '#16A34A', neutral: '#94A3B8' };

  function renderCategoryItems(items) {
    if (!items || !items.length) return '';
    return items.map(i => `
      <div class="category-item-row">
        <div class="category-item-dot" style="background:${ITEM_STATUS_COLOR[i.status] || ITEM_STATUS_COLOR.neutral}"></div>
        <div class="category-item-label">${escapeHtml(i.label)}</div>
        <div class="category-item-value">${escapeHtml(i.value)}</div>
      </div>`).join('');
  }

  function renderCategories(categories) {
    if (!categories.length) {
      return `<div class="trend-empty">A detailed category breakdown isn't available for the most recent run.</div>`;
    }
    return categories.map((cat, i) => {
      const tier = scoreTierColor(cat.score);
      return `
        <div class="category-card" data-idx="${i}" style="border-left-color:${tier}">
          <div class="category-card-header">
            <div class="category-score" style="color:${tier}">${cat.score}</div>
            <div style="flex:1">
              <div class="category-name">${escapeHtml(cat.name)}</div>
              <div class="category-detail">${cat.good}/${cat.total} passed</div>
            </div>
            <div class="category-chevron">&#9662;</div>
          </div>
          <div class="category-item-list">${renderCategoryItems(cat.items)}</div>
        </div>`;
    }).join('');
  }

  function renderWins(wins) {
    return wins.map(w => {
      const dateLabel = new Date(w.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      return `
        <div class="win-row">
          <div class="win-check">&#10003;</div>
          <div style="flex:1">
            <div class="win-text">${escapeHtml(w.text)}</div>
            ${w.detail ? `<div class="win-detail">${escapeHtml(w.detail)}</div>` : ''}
          </div>
          <div class="win-date">${dateLabel}</div>
        </div>`;
    }).join('');
  }

  function renderKeywordWins(keywordWins) {
    return keywordWins.map(w => {
      const dateLabel = new Date(w.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      return `
        <div class="win-row">
          <div class="win-check">&#9650;</div>
          <div style="flex:1">
            <div class="win-text">${escapeHtml(w.keyword)}</div>
            <div class="win-detail">Now ranking #${w.position}</div>
          </div>
          <div class="win-date">${dateLabel}</div>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  async function load() {
    let data;
    try {
      const res = await fetch(`/api/share/${encodeURIComponent(token)}/summary`);
      if (!res.ok) throw new Error('not active');
      data = await res.json();
    } catch {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      return;
    }

    const brandHex = (data.provider && data.provider.brand) || '#003366';
    const tierColor = scoreTierColor(data.score);
    const updatedLabel = new Date(data.lastAuditDate + 'T12:00:00').toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

    document.getElementById('cover').style.background = `linear-gradient(135deg, ${brandHex} 0%, #0B1D3A 100%)`;
    document.getElementById('cover-eyebrow').textContent = (data.provider ? data.provider.name : 'SEO') + ' • CLIENT DASHBOARD';
    document.getElementById('cover-name').textContent = data.client.name;
    document.getElementById('cover-url').textContent = data.client.url;
    if (data.provider && data.provider.logo) {
      const logo = document.getElementById('cover-logo');
      logo.src = data.provider.logo;
      logo.style.display = '';
    }
    document.getElementById('score-ring').innerHTML = renderScoreRing(data.score, tierColor);
    document.getElementById('score-num').textContent = data.score;
    const tierEl = document.getElementById('score-tier');
    tierEl.textContent = scoreTierLabel(data.score);
    tierEl.style.color = tierColor;
    document.getElementById('score-updated').textContent = `Last checked ${updatedLabel}`;

    document.getElementById('trend-chart').innerHTML = renderTrendChart(data.history, brandHex);
    document.getElementById('category-grid').innerHTML = renderCategories(data.categories);

    // Hidden entirely rather than shown empty — a brand-new client with
    // only one audit on record has nothing to compare yet, and "What
    // We've Fixed" with no rows reads as an empty promise, not a feature
    // that just hasn't had data to show yet.
    if (data.wins && data.wins.length) {
      document.getElementById('wins-list').innerHTML = renderWins(data.wins);
      document.getElementById('wins-card').style.display = '';
    }

    // Same "hidden entirely, not shown empty" call as the wins card above
    // — absent for most clients (no Search Console connected yet) or a
    // client with less than 2 GSC snapshots to diff.
    if (data.keywordWins && data.keywordWins.length) {
      document.getElementById('keyword-wins-list').innerHTML = renderKeywordWins(data.keywordWins);
      document.getElementById('keyword-wins-card').style.display = '';
    }

    const footer = document.getElementById('footer-note');
    if (data.provider && data.provider.email) {
      footer.innerHTML = `Questions about your results? Contact ${escapeHtml(data.provider.name)} at <a href="mailto:${escapeHtml(data.provider.email)}">${escapeHtml(data.provider.email)}</a>.`;
    }

    // Deliberately its own quiet line below the results-questions footer,
    // never attached to a specific score/category — a general "here's what
    // else we do" note, not a diagnostic upsell tied to a flagged weakness.
    if (data.provider && data.provider.crossSellNote) {
      const crossSell = document.getElementById('cross-sell-note');
      crossSell.textContent = data.provider.crossSellNote;
      crossSell.style.display = '';
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }

  // Delegated (not per-card) so it keeps working across renderCategories()
  // re-rendering the grid's innerHTML on every load() — no per-card
  // listeners to re-attach.
  document.getElementById('category-grid').addEventListener('click', (e) => {
    const card = e.target.closest('.category-card');
    if (!card) return;
    card.classList.toggle('expanded');
  });

  load();
</script>

</body>
</html>
