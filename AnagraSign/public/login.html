<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · AnagraSign</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="container narrow">
  <div class="card">
    <h1 class="logo"><svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f2a5a"/><path d="M6 23 C10 26 13 20 16 22 C18 23.3 19 21 21 19" stroke="#1d4ed8" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M10 17 L14.5 21.5 L25 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Anagra<span class="sfx">Sign</span></span></h1>
    <p class="muted">Sign in to manage documents.</p>
    <form id="form">
      <label class="lbl" for="pw">Admin password</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus required>
      <p id="err" class="error" style="margin-top:8px" hidden></p>
      <div class="row" style="margin-top:14px; justify-content:flex-end">
        <button class="btn primary" type="submit">Sign in</button>
      </div>
    </form>
  </div>
</div>
<script type="module">
  import { api } from '/js/api.js';
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;
    try {
      await api('/api/auth/login', { method: 'POST', body: { password: document.getElementById('pw').value } });
      const next = new URLSearchParams(location.search).get('next');
      location.href = next && next.startsWith('/') ? next : '/';
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false;
    }
  });
</script>
</body>
</html>
