<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Rich sage background -->
  <rect width="1200" height="630" fill="#1e2d3a"/>

  <!-- Large decorative circles -->
  <circle cx="1080" cy="-40" r="320" fill="#2C3E50"/>
  <circle cx="1160" cy="640" r="260" fill="#a75d90" opacity="0.35"/>
  <circle cx="900" cy="580" r="200" fill="#A47551" opacity="0.28"/>
  <circle cx="40" cy="620" r="180" fill="#a75d90" opacity="0.18"/>
  <circle cx="1050" cy="200" r="140" fill="#A47551" opacity="0.22"/>
  <circle cx="-30" cy="80" r="150" fill="#2C3E50" opacity="0.6"/>

  <!-- Left cream panel -->
  <rect x="0" y="0" width="700" height="630" fill="#F8F5F2" opacity="0.96"/>

  <!-- Terracotta top accent strip -->
  <rect x="0" y="0" width="700" height="7" fill="#A47551"/>

  <!-- Mauve left edge accent -->
  <rect x="0" y="0" width="5" height="630" fill="#a75d90"/>

  <!-- Logo mark -->
  <g transform="translate(72, 72)">
    <circle cx="0" cy="0" r="36" fill="#2C3E50"/>
    <path d="M0,-36 A36,36 0 0,1 0,36 A18,18 0 0,1 0,0 A18,18 0 0,0 0,-36Z" fill="#F8F5F2"/>
    <circle cx="0" cy="-18" r="7" fill="#A47551"/>
    <circle cx="0" cy="18" r="7" fill="#2C3E50"/>
    <path d="M0,-36 A18,18 0 0,0 0,0 A18,18 0 0,1 0,36" fill="#A47551" opacity="0.7"/>
  </g>

  <!-- Brand name -->
  <text x="124" y="62" font-family="Georgia, serif" font-size="22" fill="#2C3E50" letter-spacing="1.5">Parts of Practice</text>
  <text x="124" y="83" font-family="Arial, sans-serif" font-size="11" fill="#A47551" letter-spacing="3.5">IFS-INFORMED PRACTICE SUPPORT</text>

  <!-- Divider -->
  <line x1="52" y1="130" x2="648" y2="130" stroke="#D4CFC5" stroke-width="0.8"/>

  <!-- Main headline -->
  <text x="52" y="240" font-family="Georgia, serif" font-size="68" fill="#1e2d3a" font-weight="400">Website. SEO.</text>
  <text x="52" y="320" font-family="Georgia, serif" font-size="68" fill="#1e2d3a" font-weight="400">Copywriting.</text>
  <text x="52" y="415" font-family="Georgia, serif" font-size="64" fill="#a75d90" font-weight="400" font-style="italic">For therapists.</text>

  <!-- Tagline -->
  <text x="52" y="490" font-family="Arial, sans-serif" font-size="18" fill="#4A4A4A">By a licensed IFS therapist</text>
  <text x="52" y="514" font-family="Arial, sans-serif" font-size="18" fill="#4A4A4A">and a 30-year digital strategist.</text>

  <!-- CTA pill -->
  <rect x="52" y="548" width="278" height="46" rx="23" fill="#A47551"/>
  <text x="191" y="577" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#F8F5F2" text-anchor="middle" letter-spacing="1.2">partsofpractice.com</text>

  <!-- Right panel accents -->
  <text x="840" y="260" font-family="Georgia, serif" font-size="28" fill="#F8F5F2" opacity="0.6" text-anchor="middle" font-style="italic">Self-led.</text>
  <text x="840" y="310" font-family="Georgia, serif" font-size="28" fill="#A47551" opacity="0.85" text-anchor="middle" font-style="italic">Parts-aware.</text>
  <text x="840" y="360" font-family="Georgia, serif" font-size="28" fill="#a75d90" opacity="0.85" text-anchor="middle" font-style="italic">Aligned.</text>

  <!-- Decorative dots -->
  <circle cx="760" cy="460" r="5" fill="#A47551" opacity="0.6"/>
  <circle cx="780" cy="470" r="3" fill="#a75d90" opacity="0.5"/>
  <circle cx="800" cy="455" r="4" fill="#F8F5F2" opacity="0.3"/>
  <circle cx="820" cy="468" r="6" fill="#A47551" opacity="0.4"/>
  <circle cx="845" cy="458" r="3" fill="#a75d90" opacity="0.6"/>
  <circle cx="865" cy="472" r="5" fill="#F8F5F2" opacity="0.25"/>
  <circle cx="890" cy="460" r="4" fill="#A47551" opacity="0.5"/>
  <circle cx="912" cy="468" r="3" fill="#a75d90" opacity="0.4"/>
</svg>
